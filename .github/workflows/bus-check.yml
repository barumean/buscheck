name: 아침 버스 도착정보 확인

on:
  schedule:
    # 06:20 KST(UTC+9) = 전날 21:20 UTC
    - cron: "20 21 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "API 응답 원문을 로그에 출력 (구조 디버깅용)"
        type: boolean
        default: false

jobs:
  check-bus-arrival:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 버스 도착정보 조회
        env:
          BUS_SERVICE_KEY: ${{ secrets.BUS_SERVICE_KEY }}
          STATION_SERVICE_KEY: ${{ secrets.STATION_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_BUS: ${{ inputs.debug && '1' || '0' }}
        run: python scripts/check_bus_arrival.py
